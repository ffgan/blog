name: zola-blog-ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4

      - name: Check site
        run: zola check --skip-external-links

      - name: Build site
        run: zola build

      - name: Check generated HTML
        run: |
          set -euo pipefail
          # minify_html drops quotes around safe attribute values.
          require() {
            local file="$1"
            local pattern="$2"
            if ! grep -E -q "$pattern" "$file"; then
              echo "missing /${pattern}/ in ${file}" >&2
              exit 1
            fi
          }
          require public/index.html 'lang="?zh-CN"?'
          require public/index.html 'dir="?ltr"?'
          require public/index.html 'og:site_name'
          require public/index.html 'property="?og:image"?'
          require public/index.html '字'
          require public/index.html '分钟'
          test -f public/404.html
          require public/404.html '页面不存在'
          test ! -e public/js/vendor/katex
          python3 - << 'PY'
          import pathlib, re, sys
          bad = []
          for path in pathlib.Path("public").rglob("*.html"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if re.search(r"https://blog\.ffgan\.com/blog/([\"'\s>]|$)", text):
                  bad.append(str(path))
          if bad:
              print("breadcrumb still points at /blog/:", bad)
              sys.exit(1)
          PY
